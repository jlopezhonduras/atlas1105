<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="stylesheet" href="leaflet.css">
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; background: #eaf3f5; }
    .leaflet-control-attribution { font-size: 9px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="leaflet.js"></script>
  <script>
    (function () {
      const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([18, 0], 2);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      let countryLayer = null;
      window.atlasSetGeometry = function (feature) {
        if (countryLayer) map.removeLayer(countryLayer);
        countryLayer = L.geoJSON(feature, {
          style: {
            color: '#0b5e75',
            weight: 2,
            fillColor: '#b8e2e7',
            fillOpacity: 0.42
          }
        }).addTo(map);
        map.fitBounds(countryLayer.getBounds(), { padding: [16, 16], maxZoom: 7 });
        if (window.AtlasBridge && window.AtlasBridge.geometryReady) {
          window.AtlasBridge.geometryReady();
        }
      };
    })();
  </script>
</body>
</html>
